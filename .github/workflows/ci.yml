# Build and test on every push and pull request. Deployment to the VPS (docs/07-despliegue-vps.md)
# will be a separate workflow on merge to main once the server details are confirmed.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CleanCom.slnx
      - run: dotnet build CleanCom.slnx -c Release --no-restore
      - run: dotnet test CleanCom.Tests/CleanCom.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  web:
    name: Web de oficina
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      # package.json pins npm and .npmrc has engine-strict=true.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run build

  mobile:
    name: Apps móviles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
